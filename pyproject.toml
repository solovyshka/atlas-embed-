[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-score-embeddings"
version = "0.1.0"
description = "Compact PyTorch region embeddings for a residual credit scoring model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "torch==2.13.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
region-model-info = "regional_score.cli:main"
train-region-model = "regional_score.train_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
