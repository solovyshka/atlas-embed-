[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-score-embeddings"
version = "0.1.0"
description = "Compact PyTorch region embeddings for a residual credit scoring model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
region-model-info = "regional_score.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
